<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151715"><title>Contact — Focused on Tom</title><link rel="icon" href="/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#151715;color:#efeee8;font-family:Arial,Helvetica,sans-serif;line-height:1.6}main{width:min(600px,100%);margin:auto;padding:48px 24px 80px}a{color:inherit;text-underline-offset:5px}.back{color:#b2b5ac;font-size:14px}h1{font-size:clamp(40px,8vw,68px);line-height:1.05;letter-spacing:-.055em;margin:72px 0 22px}p{color:#b2b5ac}form{margin-top:36px;display:grid;gap:22px}label{display:grid;gap:8px;font-size:14px}input,textarea{font:inherit;color:inherit;background:#20231f;border:1px solid #4b5147;border-radius:8px;padding:14px;width:100%}textarea{resize:vertical;min-height:160px}:focus-visible{outline:2px solid #becbb0;outline-offset:4px}button{font:inherit;border:0;background:#dce6cf;color:#151715;padding:15px 24px;border-radius:8px;cursor:pointer;justify-self:start}button:disabled{opacity:.6}.trap{position:absolute;left:-10000px}#status{min-height:26px;margin:0}footer{margin-top:48px;font-size:14px}@media(prefers-reduced-motion:no-preference){main{animation:enter .65s ease-out}@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}}</style></head><body><main><a class="back" href="/#contact">← Back to Focused on Tom</a><h1>Let’s talk.</h1><p>Have a project in mind, a photography question, or something you’d like to share? Send me a message.</p><form id="contact-form" action="https://formspree.io/f/mdaladkg" method="post"><label>Your name<input name="name" autocomplete="name" required maxlength="200"></label><label>Your email<input name="email" type="email" autocomplete="email" required maxlength="320"></label><label>Message<textarea name="message" required minlength="5" maxlength="10000"></textarea></label><label class="trap" aria-hidden="true">Leave this blank<input name="_gotcha" tabindex="-1" autocomplete="off"></label><input type="hidden" name="source" value="focusedontom.com"><button type="submit">Send message ↗</button><p id="status" role="status" aria-live="polite"></p></form><footer>Prefer Instagram? <a href="https://instagram.com/thomasw_300" target="_blank" rel="noopener noreferrer">Message me there ↗</a></footer></main><script src="/contact/form.js" defer></script></body></html>
